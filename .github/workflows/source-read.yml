name: source read

# A page-level vantage on candidate source material, from GitHub's network.
#
# The executor environment returns 403 CONNECT at its egress proxy for every host — justtuned.com,
# news.ycombinator.com and example.com alike — and has for 36 consecutive runs. Search results are
# available to it; the pages behind them are not. Runs 44, 45 and 46 each recorded that asymmetry as
# the reason EXP-008's threshold 6 ("the find is real ... describes what was actually encountered")
# would have to be answered with *publish nothing*, and run 46 traced the consequence: no
# publication means ops/DISTRIBUTION.md's A4 freshness condition never clears, and while A4 fails no
# distribution channel is admissible for Tuned at all.
#
# This is the same mechanism the loop already uses for every production statement it makes
# (verify-production.yml, qa-browser.yml, exp003-mechanism.yml, metrics-snapshot.yml), pointed at
# third-party public pages instead of Tuned's own. ops/DISTRIBUTION.md already names the
# GitHub-network vantage as how A1/A2 venue rules are to be read; this is that vantage, built.
#
# It is deliberately NOT qa-browser.yml. That workflow curls `${target_url}/api/version` under
# `set -euo pipefail` before running its spec, which is correct for a production prober and fatal
# for anything else. Keeping them separate also keeps the two questions separate: qa-browser asks
# "what is Tuned doing", this asks "what does this page say".
#
# The optional `find` input was added in run 55, after a read that succeeded and still answered
# nothing: github.com/plenaryapp/awesome-rss-feeds came back HTTP 200 with 69,678 visible characters
# and `read_outcome: "page"`, but the reader reports the first 4,000 characters of a page, and on
# that page those are the directory tables — the contribution rules the read was for sit far below.
# `find` reports bounded windows around a LITERAL string instead of a bigger prefix, because a
# bigger prefix mirrors more of someone else's page for the same one clause and still misses it if
# the clause sits further down. It is never asserted: a rules page that does not contain the word is
# a reading about that venue, not a failure of this workflow. See qa/find-windows.mjs.
#
# Run 103 gave `find` a second job, for a failure one layer earlier than a missed clause: a page the
# reader can open whose *rules* live behind a link it cannot resolve. feedle.world names "Submit your
# blog or podcast" in its chrome; run 62 could read that text and not the address behind it, because
# the reader extracted `innerText` and never `href`, so reaching the surface meant guessing a path.
# The guess (`/submit`) returned 404 — a finding about the guess, not the venue. The read now also
# reports the resolved targets of links whose label or path carries the `find` literal. Bounded by
# that literal on purpose: a reader that returns every href on request is a crawler's front half,
# and this one still opens exactly one page per dispatch and follows nothing. See qa/nav-links.mjs.
#
# Bounded by construction: dispatch-only, read-only permissions, no secrets in scope, exactly one
# page per run, no link following, https-only, credentials in a URL refused, at most six quoted
# windows per read, and Tuned's own hosts refused outright so this can never become untracked
# headless traffic through the funnel counters EXP-007 is measuring. The refusals live in
# qa/source-read.spec.mjs, not here, so they hold however the spec is invoked.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Absolute https:// URL of ONE candidate source page to open and report"
        required: true
      find:
        description: "Optional LITERAL text to locate on the page, and to resolve link targets for (case-insensitive, not a pattern)"
        required: false

permissions:
  contents: read

concurrency:
  group: source-read
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # qa/ carries its own manifest on purpose: the Cloudflare build runs `npm ci` at the
      # repository root, and a browser toolchain must never enter the Worker's dependency tree.
      - name: Install QA harness
        working-directory: qa
        run: npm install

      - name: Install Chromium
        working-directory: qa
        run: npx playwright install --with-deps chromium

      - name: Read the page
        working-directory: qa
        env:
          SOURCE_URL: ${{ inputs.url }}
          SOURCE_FIND: ${{ inputs.find }}
        # Named explicitly rather than left to the config's testDir glob, so adding another spec to
        # qa/ can never silently change what this dispatch runs.
        run: npx playwright test source-read.spec.mjs

      # The screenshot is the part a human can check without trusting the JSON: it shows the page
      # that was actually on screen. `always()` because a refused or gated read is the reading that
      # matters most.
      - name: Upload read evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-read-evidence
          path: qa/artifacts
          if-no-files-found: error
          retention-days: 30
