name: executor liveness

# Is the executor loop still firing? Nothing answered that until run 147.
#
# Between 2026-09-07T10:05:18Z and 2026-09-10T04:03:37Z the routine fired seven times on
# its 04:00/10:00/22:00 UTC cron and produced nothing — no lock claim, no commit, no
# execution report. It was found by reading the claims register by hand — 66 hours after the
# last run that did start, and 45 hours after this file would have raised the alarm — and
# only because a run happened to look. `metrics snapshot` kept committing twice a day under
# the same author line the executor uses, so the repository looked busy throughout.
#
# WHY IT IS HERE AND NOT IN THE LOOP. An alarm hosted inside the thing it watches is not an
# alarm. This workflow runs on GitHub's cron and depends on nothing the Claude routine
# provides; it fires whether or not the routine still exists.
#
# WHY IT INSTALLS NOTHING. No `npm ci`, no setup-node beyond the runner's own. The script
# imports node builtins and one local module. A watchdog that needs the npm registry to be
# up has a second way to be wrong about the thing it is watching.
#
# The two thresholds — 20h between consecutive claims, 23h of wall-clock silence — and the
# reason there are two of them are derived in the header of scripts/executor-liveness.mjs.
# The short version: this repository's scheduled runs have been delivered 1.6h to 4.5h late
# every time since 2026-08-26, a late check reads an age that is too large, and the fix is
# to take the verdict that matters from the register's own timestamps instead of the clock.
# The arithmetic is exercised by scripts/executor-liveness.test.mjs, which replays the
# outage hour by hour and again at each measured lag.
on:
  schedule:
    # Hourly, because the observed age only tracks the real gap if the check looks more
    # often than the outage lasts. A three-a-day version of this file could not see a 24h
    # outage at all; see the script header. Note this is the requested rate, not the
    # delivered one — GitHub owes nothing here, which is why the `missed-runs` verdict is
    # written to survive a sampler that slept through the entire outage.
    - cron: "35 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: executor-liveness
  cancel-in-progress: false

jobs:
  liveness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # FULL HISTORY, BECAUSE THE SECOND SOURCE IS THIS HISTORY. The verdict split added on
      # 2026-09-13 asks git whether any executor session committed during the register's
      # silence, and `actions/checkout`'s default depth of 1 answers "none" to every such
      # question. That is not a slow check, it is a check that always says the loop was down
      # — the exact false alarm the split exists to remove, restored silently. The script
      # fails safe if this is ever dropped (a shallow repository returns "cannot answer", not
      # "nothing"), and the alarm then says the second source was not consulted; this line is
      # what makes it able to answer at all.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # `continue-on-error` so the alarm below still runs; the job is failed explicitly at
      # the end. Without that the comment step would be skipped on exactly the runs it
      # exists for.
      - name: Read the executor claims register
        id: liveness
        continue-on-error: true
        run: node scripts/executor-liveness.mjs --json

      # One comment per outage, not one per hour. The marker carries the script's alarm
      # key: for an open outage that is the newest claim (constant while the loop stays
      # down), and for one the register proves has already ended it is the last claim
      # BEFORE the gap — which stays constant after the loop recovers, where the newest
      # claim does not. A second outage gets its own key and its own comment; a continuing
      # one, and the same outage re-observed after recovery, get none.
      - name: Raise the alarm on issue #1
        if: steps.liveness.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REASON: ${{ steps.liveness.outputs.reason }}
          ALARM_KEY: ${{ steps.liveness.outputs.alarm_key }}
          STALE_SINCE: ${{ steps.liveness.outputs.stale_since }}
          AGE_HOURS: ${{ steps.liveness.outputs.age_hours }}
          HOLDER: ${{ steps.liveness.outputs.holder }}
          CYCLE: ${{ steps.liveness.outputs.cycle }}
          GAP_FROM: ${{ steps.liveness.outputs.gap_from }}
          GAP_TO: ${{ steps.liveness.outputs.gap_to }}
          GAP_HOURS: ${{ steps.liveness.outputs.gap_hours }}
          UNCLAIMED: ${{ steps.liveness.outputs.unclaimed }}
          CORROBORATED: ${{ steps.liveness.outputs.corroborated }}
          ACTIVITY_COMMITS: ${{ steps.liveness.outputs.activity_commits }}
          ACTIVITY_SESSIONS: ${{ steps.liveness.outputs.activity_sessions }}
          ACTIVITY_FIRST: ${{ steps.liveness.outputs.activity_first }}
          ACTIVITY_LAST: ${{ steps.liveness.outputs.activity_last }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          marker="<!-- executor-liveness-alarm key=${ALARM_KEY:-unknown} -->"

          # Search the issue's own comments rather than a label or a state file: the
          # comment is the thing being deduplicated, so it is also the only record that
          # cannot drift out of step with what the owner actually received.
          #
          # Written to a file rather than piped into grep on purpose. Under `pipefail`,
          # `grep -Fq` exits at the first match and closes the pipe, so gh dies of EPIPE
          # and the pipeline reports failure on exactly the runs where the marker WAS
          # found — the dedupe would invert and comment every hour.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/1/comments" \
            --jq '.[].body' > comments.txt

          if grep -Fq "$marker" comments.txt; then
            echo "Alarm for ${STALE_SINCE:-unknown} already posted; not repeating it."
            exit 0
          fi

          # TWO OUTAGES WEARING ONE HEADLINE WAS THE 2026-09-13 DEFECT. A register that has
          # gone quiet means either that no session ran or that a session ran and skipped
          # step 0, and the owner action for those is opposite: restart the routine, versus
          # leave it alone and fix the protocol. The script now separates them against an
          # independent source (executor commits on master, identified by their session
          # trailer), and everything below branches on that rather than asserting the
          # outage. See ops/LESSONS.md L-75.
          {
            echo "$marker"
            echo
            if [ "${UNCLAIMED:-false}" = "true" ]; then
              echo "## Executor loop is running without claiming the run lock"
              echo
              echo "The scheduled executor routine claims the run lock as step 0 of every run, before"
              echo "any commit or comment. **It is firing, and it is not claiming** — the register has"
              echo "gone quiet while sessions kept committing, so the lock is no longer protecting"
              echo "anything against a second session firing on the same directive."
            else
              echo "## Executor loop is not firing"
              echo
              echo "The scheduled executor routine claims the run lock as step 0 of every run, before"
              echo "any commit or comment. The claims register says runs are being lost."
              if [ "${CORROBORATED:-false}" = "true" ]; then
                echo
                echo "**No executor session committed in that interval either** — two independent"
                echo "sources agreeing, which is what separates this from a protocol lapse."
              fi
            fi
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Verdict | \`${REASON}\` |"
            if [ -n "${GAP_FROM:-}" ]; then
              if [ "${UNCLAIMED:-false}" = "true" ]; then
                echo "| Unclaimed between | ${GAP_FROM} and ${GAP_TO} |"
                echo "| Length of that gap | ${GAP_HOURS:-n/a}h with no claim |"
              else
                echo "| Runs missed between | ${GAP_FROM} and ${GAP_TO} |"
                echo "| Length of that gap | ${GAP_HOURS:-n/a}h with no run at all |"
              fi
            fi
            if [ "${UNCLAIMED:-false}" = "true" ]; then
              echo "| Sessions that ran anyway | ${ACTIVITY_SESSIONS:-n/a}, ${ACTIVITY_COMMITS:-n/a} commit(s) |"
              echo "| First / last of them | ${ACTIVITY_FIRST:-n/a} … ${ACTIVITY_LAST:-n/a} |"
            fi
            echo "| Newest executor claim | ${STALE_SINCE:-none found} |"
            echo "| Age at detection | ${AGE_HOURS:-n/a}h |"
            echo "| Last holder / cycle | ${HOLDER:-n/a} / ${CYCLE:-n/a} |"
            echo "| Detected by | [${GITHUB_WORKFLOW} run](${RUN_URL}) |"
            echo
            if [ "${REASON}" = "missed-runs" ]; then
              echo "**The loop has since recovered.** This gap is read from the register itself, not"
              echo "from the clock, so it is reported even though the outage has ended — the runs"
              echo "inside it are still lost, and nothing else would ever have said so."
              echo
            fi
            if [ "${UNCLAIMED:-false}" = "true" ]; then
              echo "**What this does and does not say.** It says executor sessions ran in this"
              echo "interval and none of them reached step 0. It is **not** an outage and the routine"
              echo "needs no restarting; it is the run-lock protocol failing silently, which matters"
              echo "because the lock is the only thing stopping two concurrently-fired sessions from"
              echo "implementing the same directive twice — as happened in PRs #7/#8 and #9/#10. It"
              echo "is not a product or production signal either: production is verified separately"
              echo "by \`verify production\`, which is unaffected by this."
              echo
              echo "**Owner action: none required.** This is the executor's own protocol to repair,"
              echo "and the next run should say in its report why step 0 was skipped and what now"
              echo "stops it recurring. Escalate only if it repeats after that."
            else
              if [ "${CORROBORATED:-false}" = "true" ]; then
                echo "**What this does and does not say.** It says no executor session reached step 0,"
                echo "and that none committed in the interval either — so the two sources agree the"
                echo "loop was down rather than merely quiet."
              else
                echo "**What this does and does not say.** It says no executor session reached step 0."
                echo "**The second source was not consulted on this verdict** — these are the"
                echo "fail-closed paths, where there is no interval to ask about — so this does not"
                echo "distinguish a loop that is down from one that is running without claiming."
              fi
              echo "It does not say why, and it is not a product or production signal: production is"
              echo "verified separately by \`verify production\`, which is unaffected by this. The"
              echo "repository may still look active — \`metrics snapshot\` commits twice a day on its"
              echo "own schedule, under the same author line the executor uses, and those commits"
              echo "carry no session trailer and are excluded from the check above."
              echo
              echo "**Owner action.** Check that the routine is enabled and firing."
            fi
            echo
            echo "This comment is posted once per outage; it will not repeat until the loop claims"
            echo "again and a new outage begins."
            echo
            echo "---"
            echo "_Generated by [Claude Code](https://claude.ai/code)_"
          } > alarm.md

          # -F, not -f: `@` reads the value from a file, which keeps the body out of the
          # argument list and out of any shell quoting.
          gh api "repos/${GITHUB_REPOSITORY}/issues/1/comments" -F "body=@alarm.md"

      # The job's own conclusion has to reflect the verdict, or the Actions list shows a
      # green run for a down loop — which is the failure mode this whole file is about.
      - name: Fail the run when the loop is stale
        if: steps.liveness.outcome == 'failure'
        run: |
          echo "Executor liveness check failed: ${{ steps.liveness.outputs.reason }}" >&2
          exit 1
