name: qa-browser

# A reusable browser vantage point on production.
#
# The executor environment has had no direct egress to justtuned.com for nineteen consecutive runs,
# so a real browser inside Actions is the only way this loop can look at its own product. EXP-003
# built the first one; rather than copy that workflow per experiment, this one takes the spec as an
# input so the next browser question costs a spec file and not another 50 lines of YAML.
#
# `.github/workflows/exp003-mechanism.yml` is deliberately NOT replaced by this. It is the
# pre-registered instrument of a closed experiment, and a closed experiment's apparatus should stay
# exactly as it was when it produced its result.
#
# Dispatch-only on purpose: these are experiments, not gates. Running them on every push would put
# recurring headless traffic through production's own funnel counters for no additional evidence.
on:
  workflow_dispatch:
    inputs:
      spec:
        description: "Spec file under qa/ to run"
        required: true
        default: "public-surfaces.spec.mjs"
      target_url:
        description: "Origin to test (defaults to production)"
        required: false
        default: "https://justtuned.com"

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # qa/ deliberately carries its own manifest. The Cloudflare build runs `npm ci` at the
      # repository root, and a browser toolchain must never end up in the Worker's dependency tree.
      - name: Install QA harness
        working-directory: qa
        run: npm install

      - name: Install Chromium
        working-directory: qa
        run: npx playwright install --with-deps chromium

      - name: Record which build is serving
        run: |
          set -euo pipefail
          echo "target: ${{ inputs.target_url }}"
          echo -n "/api/version: "
          curl -sS --max-time 20 "${{ inputs.target_url }}/api/version"
          echo

      - name: Run browser spec
        working-directory: qa
        env:
          TARGET_URL: ${{ inputs.target_url }}
        # The spec is named explicitly rather than left to the config's testDir glob, so adding a
        # second spec to qa/ can never silently change what a given dispatch runs.
        run: npx playwright test "${{ inputs.spec }}"

      # Screenshots at both widths are the owner-facing evidence, and they matter most when the run
      # is red — so this is `always()`, not `success()`.
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-browser-evidence
          path: qa/artifacts
          if-no-files-found: error
          retention-days: 30
