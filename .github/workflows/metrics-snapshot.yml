name: metrics snapshot

# The executor routine has no egress to justtuned.com and holds no Cloudflare
# credentials, so it cannot read production metrics directly. This workflow is the
# read path: it pulls the key-gated aggregate endpoint and commits the JSON into the
# repository, where the executor can read it like any other file.
#
# Requires repository secret METRICS_KEY, matching the Worker secret of the same name.
# Without it the job exits cleanly rather than failing, so the workflow can ship before
# the secret exists.

# Why there are two schedules, and why only one of them probes.
#
# `daily` in the payload is the whole 60-day history, not just today, so any snapshot
# taken after 00:00 UTC carries every earlier day complete. The 20:40 run is the operating
# read — it lands before the 08:00 Sydney executor run — but it is taken *inside* the UTC
# day, so the day it is named after is always partial, and the first complete copy of it
# would not otherwise exist until ~21h later. Any reading pre-registered over complete UTC
# days therefore had no admissible source on the morning after its window closed. The
# 00:15 run fixes that: it exists so the previous UTC day is on disk, complete, within
# minutes of ending.
#
# The 00:15 run skips the probe step below. `/api/version` and `/api/metrics` write no
# counters, so with the probes off the run is inert — it moves no metric, which is what
# lets it be added while a pre-registered window is open without perturbing it. It also
# keeps the published note in src/metrics.ts true: /ava/rss.xml is still fetched on a
# schedule twice a day, by verify-production and by the 20:40 run here.
on:
  schedule:
    - cron: "40 20 * * *" # 06:40 Sydney (AEST), before the 08:00 executor run
    - cron: "15 0 * * *" # just after the UTC day ends: captures it complete, probes nothing
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metrics-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Runs before the fetch and never fails the job: when the read path is red, the
      # diagnosis has to survive in the log of the run that failed. Bodies are never
      # printed — only status, content type, size and the Cloudflare Ray ID, which is what
      # locates the matching Security Event if the edge is what answered.
      #
      # Skipped on the 00:15 schedule so that run writes no counter at all — see the
      # header. Every other trigger, workflow_dispatch included, still probes.
      - name: Diagnose the production read path
        if: github.event.schedule != '15 0 * * *'
        env:
          METRICS_KEY: ${{ secrets.METRICS_KEY }}
        run: |
          set -uo pipefail
          chmod +x scripts/prod-http.sh
          scripts/prod-http.sh probe https://justtuned.com/            landing    'text/html'
          scripts/prod-http.sh probe https://justtuned.com/api/version version    'application/json'
          scripts/prod-http.sh probe https://justtuned.com/api/metrics metrics-un 'application/json' 0
          scripts/prod-http.sh probe https://justtuned.com/api/metrics metrics-au 'application/json' 1
          # Not incidental. Open RSS is a public promise on the landing page and the thing
          # agent members consume; if the edge is challenging non-browser clients then this
          # is broken for every feed reader, which is a product outage and not a CI problem.
          scripts/prod-http.sh probe https://justtuned.com/ava/rss.xml rss        'application/rss+xml'
          scripts/prod-http.sh probe "$(scripts/prod-http.sh origin)/api/version" origin-ver 'application/json'

      # Counters are internal state, so reading them through the Worker's own origin while
      # the zone is challenging clients is legitimate — it asserts nothing about whether
      # anyone can visit the site. It does mean a snapshot taken during an outage will show
      # depressed arrivals, which is a fact about the outage and not about demand. The
      # commit message carries which vantage produced it so no later run has to guess.
      - name: Choose a vantage point
        id: vantage
        run: |
          set -uo pipefail
          # Repeated rather than inherited: the step that used to do this is skipped on the
          # 00:15 schedule, and a vantage step that only works after a probe step is a
          # coupling nobody would look for.
          chmod +x scripts/prod-http.sh
          scripts/prod-http.sh vantage | tee -a "$GITHUB_OUTPUT"

      - name: Fetch aggregate metrics
        id: fetch
        env:
          METRICS_KEY: ${{ secrets.METRICS_KEY }}
          BASE: ${{ steps.vantage.outputs.base }}
          ZONE_BLOCKED: ${{ steps.vantage.outputs.zone_blocked }}
        run: |
          set -euo pipefail
          if [ -z "${METRICS_KEY:-}" ]; then
            echo "::notice::METRICS_KEY is not set — skipping snapshot."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p ops/metrics
          code=$(scripts/prod-http.sh get "${BASE}/api/metrics" /tmp/metrics.json 'application/json' 1)
          if [ "$code" != "200" ]; then
            echo "::error::/api/metrics returned HTTP $code"
            # Deliberately not `head -c 500` of the body any more: on 2026-08-10 that echoed
            # a Cloudflare challenge page into the log, and the same line would echo an
            # authenticated aggregate body on a partial failure. The shape is enough.
            head -c 200 /tmp/metrics.json | tr -cd '[:print:]' | sed 's/^/body-prefix: /' || true
            echo
            exit 1
          fi
          python3 -m json.tool /tmp/metrics.json > ops/metrics/latest.json
          cp ops/metrics/latest.json "ops/metrics/$(date -u +%Y-%m-%d).json"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          if [ "${ZONE_BLOCKED}" = "true" ]; then
            echo "::warning::Read via the Worker origin — justtuned.com was not serving. Arrival counters for this window reflect an outage, not demand."
          fi

      - name: Commit snapshot
        if: steps.fetch.outputs.skip == 'false'
        env:
          ZONE_BLOCKED: ${{ steps.vantage.outputs.zone_blocked }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/metrics
          if git diff --cached --quiet; then
            echo "No metric change."
            exit 0
          fi
          if [ "${ZONE_BLOCKED}" = "true" ]; then
            git commit -m "ops: metrics snapshot $(date -u +%Y-%m-%d) (read via Worker origin; justtuned.com not serving)"
          else
            git commit -m "ops: metrics snapshot $(date -u +%Y-%m-%d)"
          fi
          git push
