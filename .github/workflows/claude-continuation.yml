name: Continue Claude executor

# Event-driven handoff for the Tuned 60-day operating loop.
# This workflow is inert until both repository secrets are configured:
#   CLAUDE_ROUTINE_FIRE_URL
#   CLAUDE_ROUTINE_TOKEN
#
# RUNAWAY GUARD — read before loosening the `if:` below.
#
# The executor ships by pushing to master. Firing on every successful `check` run
# therefore closes a cycle: push -> check -> fire -> executor -> push -> ...
# On 2026-08-06 that cycle ran three times in six minutes (feb6c4f, 6b08344,
# d9697e9) with nothing bounding it but the executor's own judgement about when to
# stop. That is a soft guard on unbounded Claude spend and unbounded unattended
# production deploys, and it bypasses the 3x/day cadence the owner configured.
#
# So push-driven continuation is now opt-in and defaults closed: the executor adds
# the [continue] marker to a commit message only when it is deliberately leaving
# staged multi-step work that should not wait for the next scheduled run. An
# ordinary commit ends the chain. A reviewer directive on issue #1 still fires
# immediately — that event is owner/reviewer-initiated and cannot self-sustain.
on:
  workflow_run:
    workflows: ["check"]
    types: [completed]
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: tuned-claude-continuation
  cancel-in-progress: false

jobs:
  fire:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'master' &&
       github.event.workflow_run.conclusion == 'success' &&
       contains(github.event.workflow_run.head_commit.message, '[continue]')) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 1 &&
       contains(github.event.comment.body, '<!-- tuned-review-directive -->'))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      CLAUDE_ROUTINE_FIRE_URL: ${{ secrets.CLAUDE_ROUTINE_FIRE_URL }}
      CLAUDE_ROUTINE_TOKEN: ${{ secrets.CLAUDE_ROUTINE_TOKEN }}
    steps:
      - name: Await routine API configuration
        if: ${{ env.CLAUDE_ROUTINE_FIRE_URL == '' || env.CLAUDE_ROUTINE_TOKEN == '' }}
        run: echo "Claude continuation is installed but not armed; configure both repository secrets."

      - name: Fire next Claude executor session
        if: ${{ env.CLAUDE_ROUTINE_FIRE_URL != '' && env.CLAUDE_ROUTINE_TOKEN != '' }}
        shell: bash
        run: |
          jq -n \
            --arg text "Resume the Tuned 60-day operating loop from GitHub issue #1 and ops state. Inspect the latest commit, checks, deployment evidence, and reviewer directive. Take the next bounded action, then update shared state. Stop without pushing if no justified action remains or an owner boundary is reached." \
            '{text: $text}' > "${RUNNER_TEMP}/routine-fire.json"

          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --max-time 30 \
            -X POST "${CLAUDE_ROUTINE_FIRE_URL}" \
            -H "Authorization: Bearer ${CLAUDE_ROUTINE_TOKEN}" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "anthropic-version: 2023-06-01" \
            -H "Content-Type: application/json" \
            --data-binary @"${RUNNER_TEMP}/routine-fire.json"
