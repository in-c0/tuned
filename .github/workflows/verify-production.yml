name: verify production

# The executor routine cannot reach justtuned.com (its egress proxy returns 403 CONNECT),
# so "verify production after deploying, roll back on regression" was not something it
# could actually do. This runs from GitHub's network after every push to master and
# publishes a result the executor can read through the Actions API.
#
# Cloudflare Workers Builds deploys asynchronously — a push-triggered run starts seconds
# after the merge, minutes before the new version is live. So the job first proves the
# expected commit is the one answering, and only then judges health. It fails closed if
# that commit never appears: a health check against an unknown version verifies nothing.
#
# No secrets are used beyond the automatic GITHUB_TOKEN (read-only, and only to classify
# a timeout), so this cannot check authenticated behaviour — only that the site is up and
# that the metrics endpoint refuses unauthenticated callers.

on:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: "20 20 * * *" # 06:20 Sydney, before the metrics snapshot

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Prove the expected commit is the one serving
        env:
          EXPECTED: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # /api/version reports the commit stamped into the bundle at build time
        # (scripts/build-info.mjs, run by wrangler's build hook). That is immutable
        # per-deploy build evidence: unlike route existence or a fixed sleep, it cannot
        # be satisfied by the version that was already serving before this push.
        run: |
          set -uo pipefail
          deadline=$(( SECONDS + 600 ))
          attempt=0
          serving=""
          while [ "$SECONDS" -lt "$deadline" ]; do
            attempt=$(( attempt + 1 ))
            serving=$(curl -sS --max-time 20 https://justtuned.com/api/version 2>/dev/null \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit",""))' 2>/dev/null || true)
            if [ "$serving" = "$EXPECTED" ]; then
              echo "serving commit ${serving} == expected — the deploy under test is live (attempt ${attempt})"
              exit 0
            fi
            echo "attempt ${attempt}: serving '${serving:-<no /api/version>}', expected ${EXPECTED} — waiting 20s"
            sleep 20
          done
          # Fail closed, but say which failure it is. "Never deployed" and "already
          # superseded by a newer push" call for completely different responses.
          reason="the expected build never went live"
          if [ -n "$serving" ] && [ "$serving" != "dev" ]; then
            status=$(curl -sS -H "authorization: Bearer ${GH_TOKEN}" -H "accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/compare/${EXPECTED}...${serving}" 2>/dev/null \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status",""))' 2>/dev/null || true)
            case "$status" in
              ahead) reason="superseded — ${serving} is a later commit and is already serving" ;;
              behind|identical) reason="an older commit (${serving}) is still serving; the deploy did not land" ;;
              *) reason="an unrelated commit (${serving}) is serving; could not classify it against ${EXPECTED}" ;;
            esac
          fi
          echo "::error::After 10 minutes, ${EXPECTED} is not serving justtuned.com: ${reason}. Not verifying health against an unknown version."
          exit 1

      - name: Version endpoint exposes the commit and nothing else
        run: |
          set -euo pipefail
          curl -sS --max-time 20 -o /tmp/v.json https://justtuned.com/api/version
          keys=$(python3 -c 'import json;print(",".join(sorted(json.load(open("/tmp/v.json")))))')
          if [ "$keys" != "commit" ]; then
            echo "::error::/api/version returned unexpected fields: ${keys}"
            exit 1
          fi
          echo "/api/version: {commit} only"

      - name: Site is up
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 20 -o /tmp/home.html -w '%{http_code}' https://justtuned.com/ || echo 000)
          if [ "$code" != "200" ]; then
            echo "::error::justtuned.com returned HTTP $code"
            exit 1
          fi
          grep -qi 'tuned' /tmp/home.html || { echo "::error::landing page body does not look like Tuned"; exit 1; }
          echo "justtuned.com: HTTP 200, landing page rendered ($(wc -c < /tmp/home.html) bytes)"

      - name: Metrics endpoint refuses unauthenticated callers
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 20 -o /tmp/m.json -w '%{http_code}' https://justtuned.com/api/metrics || echo 000)
          case "$code" in
            401) echo "/api/metrics without a key: HTTP 401 — key is set and the endpoint is closed." ;;
            503) echo "/api/metrics without a key: HTTP 503 — METRICS_KEY is not configured yet; endpoint fails closed." ;;
            200)
              echo "::error::/api/metrics returned 200 with NO key — aggregate data is public. Roll back."
              exit 1 ;;
            *)
              echo "::error::/api/metrics returned unexpected HTTP $code"
              exit 1 ;;
          esac

      - name: Public pages still render
        run: |
          set -euo pipefail
          for path in /terms /privacy; do
            code=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "https://justtuned.com${path}" || echo 000)
            [ "$code" = "200" ] || { echo "::error::${path} returned HTTP $code"; exit 1; }
            echo "${path}: HTTP 200"
          done
