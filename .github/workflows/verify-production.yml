name: verify production

# The executor routine cannot reach justtuned.com (its egress proxy returns 403 CONNECT),
# so "verify production after deploying, roll back on regression" was not something it
# could actually do. This runs from GitHub's network after every push to master and
# publishes a result the executor can read through the Actions API.
#
# Cloudflare Workers Builds deploys asynchronously, so the job starts minutes before the
# new version is live. The first step therefore waits for the *expected commit* to be the
# one serving, by reading /api/version — a build stamp baked in by scripts/build-info.mjs.
#
# It used to wait for "/api/metrics stops returning 404" instead. That worked exactly
# until the telemetry build shipped: once every version had the route, the check passed
# on the first attempt against whatever was already serving and proved nothing but the
# sleep before it. Health steps then reported on the *old* Worker while reading as
# confirmation of the new one. Identity is checked here, not inferred from timing.
#
# No secrets are used, so it cannot check authenticated behaviour — only that the site is
# up and that the metrics endpoint refuses unauthenticated callers.

on:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: "20 20 * * *" # 06:20 Sydney, before the metrics snapshot

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the expected commit to be serving
        id: live
        env:
          EXPECTED: ${{ github.sha }}
        run: |
          set -uo pipefail
          # 24 x 20s = 8 minutes. Workers Builds normally lands in ~2; the margin is for
          # a queued build. Every exit path is explicit — a bare failure of curl must not
          # look like a match.
          serving=""
          for attempt in $(seq 1 24); do
            body=$(curl -sS --max-time 20 -H 'cache-control: no-cache' https://justtuned.com/api/version || echo '')
            # Extracted by pattern rather than parsed. A commit stamp is a fixed shape, so
            # this accepts only that shape: an old Worker's 404 text, an HTML error page,
            # a non-string commit, or an empty body all yield "" and keep the loop waiting.
            # (Written as one line on purpose — a multi-line interpreter script here ends
            #  the YAML block scalar and silently unregisters the whole workflow.)
            serving=$(printf '%s' "$body" | grep -oE '"commit"[[:space:]]*:[[:space:]]*"[0-9a-f]{7,40}"' | grep -oE '[0-9a-f]{7,40}' | head -1 || true)

            if [ "$serving" = "$EXPECTED" ]; then
              echo "serving=$serving" >> "$GITHUB_OUTPUT"
              echo "Expected commit $EXPECTED is live (attempt $attempt)."
              echo "Verified build: \`$EXPECTED\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            echo "attempt $attempt: serving '${serving:-<no build stamp>}', expecting '$EXPECTED' — waiting 20s"
            sleep 20
          done

          # Fail closed. An unverifiable deploy is treated as a failed deploy: the health
          # steps below are skipped rather than run against an unknown version, because a
          # green result on the wrong Worker is worse than no result.
          echo "::error::Expected commit $EXPECTED never became live (last seen: '${serving:-<no build stamp>}'). The Cloudflare build may have failed, or the deploy is stuck."
          exit 1

      - name: Site is up
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 20 -o /tmp/home.html -w '%{http_code}' https://justtuned.com/ || echo 000)
          if [ "$code" != "200" ]; then
            echo "::error::justtuned.com returned HTTP $code"
            exit 1
          fi
          grep -qi 'tuned' /tmp/home.html || { echo "::error::landing page body does not look like Tuned"; exit 1; }
          echo "justtuned.com: HTTP 200, landing page rendered ($(wc -c < /tmp/home.html) bytes)"

      - name: Metrics endpoint refuses unauthenticated callers
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 20 -o /tmp/m.json -w '%{http_code}' https://justtuned.com/api/metrics || echo 000)
          case "$code" in
            401) echo "/api/metrics without a key: HTTP 401 — key is set and the endpoint is closed." ;;
            503) echo "/api/metrics without a key: HTTP 503 — METRICS_KEY is not configured yet; endpoint fails closed." ;;
            200)
              echo "::error::/api/metrics returned 200 with NO key — aggregate data is public. Roll back."
              exit 1 ;;
            *)
              echo "::error::/api/metrics returned unexpected HTTP $code"
              exit 1 ;;
          esac
          # Recorded so the executor can read the METRICS_KEY state off the run summary
          # without a second request it has no egress for.
          echo "Unauthenticated \`/api/metrics\`: HTTP $code" >> "$GITHUB_STEP_SUMMARY"

      - name: Public pages still render
        run: |
          set -euo pipefail
          for path in /terms /privacy; do
            code=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "https://justtuned.com${path}" || echo 000)
            [ "$code" = "200" ] || { echo "::error::${path} returned HTTP $code"; exit 1; }
            echo "${path}: HTTP 200"
          done
