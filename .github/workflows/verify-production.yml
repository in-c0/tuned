name: verify production

# The executor routine cannot reach justtuned.com (its egress proxy returns 403 CONNECT),
# so "verify production after deploying, roll back on regression" was not something it
# could actually do. This runs from GitHub's network after every push to master and
# publishes a result the executor can read through the Actions API.
#
# Cloudflare Workers Builds deploys asynchronously, so the job starts minutes before the
# new version is live. The first step therefore waits for the *expected commit* to be the
# one serving, by reading /api/version — a build stamp baked in by scripts/build-info.mjs.
#
# It used to wait for "/api/metrics stops returning 404" instead. That worked exactly
# until the telemetry build shipped: once every version had the route, the check passed
# on the first attempt against whatever was already serving and proved nothing but the
# sleep before it. Health steps then reported on the *old* Worker while reading as
# confirmation of the new one. Identity is checked here, not inferred from timing.
#
# No secrets are used, so it cannot check authenticated behaviour — only that the site is
# up and that the metrics endpoint refuses unauthenticated callers.

on:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: "20 20 * * *" # 06:20 Sydney, before the metrics snapshot

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Full history, because the wait step below asks whether the serving commit
      # *contains* the expected one. A shallow clone answers "no" to that for every
      # commit, which is the silent-false-negative direction.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Never fails the job. Its whole purpose is to leave a diagnosis in the log of the
      # run that went red — on 2026-08-10 the wait step below burned eight minutes printing
      # "<no build stamp>" twenty-four times, which recorded that something was wrong and
      # nothing about what. Bodies are never printed; the Cloudflare Ray ID is, because that
      # is what locates the matching Security Event when the edge is what answered.
      - name: Diagnose the production read path
        run: |
          set -uo pipefail
          chmod +x scripts/prod-http.sh
          scripts/prod-http.sh probe https://justtuned.com/            landing 'text/html'
          scripts/prod-http.sh probe https://justtuned.com/api/version version 'application/json'
          scripts/prod-http.sh probe https://justtuned.com/api/metrics metrics 'application/json'
          scripts/prod-http.sh probe https://justtuned.com/ava/rss.xml rss     'application/rss+xml'
          # The same Worker reached directly, outside the zone. Two rows that disagree put
          # the fault at the edge in a single reading; two rows that agree say the Worker
          # itself is down. Before this existed, telling those apart was an owner action.
          scripts/prod-http.sh probe "$(scripts/prod-http.sh origin)/api/version" origin-version 'application/json'

      # Which host the steps below read from, and — separately — whether the public zone is
      # serving at all. The second fact is graded at the end of the job and can turn a fully
      # healthy Worker into a red run, which is correct: a site the public cannot reach is
      # down no matter how well the code behind it is working.
      - name: Choose a vantage point
        id: vantage
        run: |
          set -uo pipefail
          scripts/prod-http.sh vantage | tee -a "$GITHUB_OUTPUT"

      - name: Wait for the expected commit to be serving
        id: live
        env:
          EXPECTED: ${{ github.sha }}
          BASE: ${{ steps.vantage.outputs.base }}
        run: |
          set -uo pipefail
          # 24 x 20s = 8 minutes. Workers Builds normally lands in ~2; the margin is for
          # a queued build. Every exit path is explicit — a bare failure of curl must not
          # look like a match.
          serving=""
          for attempt in $(seq 1 24); do
            code=$(scripts/prod-http.sh get "${BASE}/api/version" /tmp/version.json 'application/json')
            body=$([ "$code" = "200" ] && cat /tmp/version.json || echo '')
            # Extracted by pattern rather than parsed. A commit stamp is a fixed shape, so
            # this accepts only that shape: an old Worker's 404 text, an HTML error page,
            # a non-string commit, or an empty body all yield "" and keep the loop waiting.
            # (Written as one line on purpose — a multi-line interpreter script here ends
            #  the YAML block scalar and silently unregisters the whole workflow.)
            serving=$(printf '%s' "$body" | grep -oE '"commit"[[:space:]]*:[[:space:]]*"[0-9a-f]{7,40}"' | grep -oE '[0-9a-f]{7,40}' | head -1 || true)

            if [ "$serving" = "$EXPECTED" ]; then
              echo "serving=$serving" >> "$GITHUB_OUTPUT"
              echo "Expected commit $EXPECTED is live (attempt $attempt)."
              echo "Verified build: \`$EXPECTED\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            # Equality is the wrong question, and asking it made this check go red on
            # 2026-09-06 while the change under test was live and healthy. Cloudflare
            # builds whatever the tip of master is when the build starts, and this
            # repository has a *scheduled* workflow that commits to master
            # (metrics-snapshot.yml, 20:40 and 00:15 UTC, and GitHub's scheduler runs
            # late). Any commit landing between the push and the build makes an exact
            # match permanently unsatisfiable — the job then reports "the deploy never
            # landed" about a deploy that landed and superseded it, and this loop's own
            # rule is to roll back on that. So the question is *containment*: is the
            # pushed commit part of what is serving?
            #
            # Fetch each attempt, because a commit pushed after checkout is not in the
            # clone yet — which is precisely the case this exists for. Unknown objects
            # fail closed: no match, keep waiting.
            git fetch --quiet --no-tags origin master 2>/dev/null || true
            if [ -n "$serving" ] && git cat-file -e "${serving}^{commit}" 2>/dev/null \
               && git merge-base --is-ancestor "$EXPECTED" "$serving" 2>/dev/null; then
              echo "serving=$serving" >> "$GITHUB_OUTPUT"
              echo "Expected commit $EXPECTED is live inside a newer build $serving (attempt $attempt)."
              echo "Verified build: \`$serving\`, which contains \`$EXPECTED\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            echo "attempt $attempt: serving '${serving:-<no build stamp>}', expecting '$EXPECTED' (or a descendant of it) — waiting 20s"
            sleep 20
          done

          # Fail closed. An unverifiable deploy is treated as a failed deploy: the health
          # steps below are skipped rather than run against an unknown version, because a
          # green result on the wrong Worker is worse than no result.
          echo "::error::Expected commit $EXPECTED never became live, and nothing serving contained it (last seen: '${serving:-<no build stamp>}'). The Cloudflare build may have failed, or the deploy is stuck."
          exit 1

      - name: Site is up
        env:
          BASE: ${{ steps.vantage.outputs.base }}
        run: |
          set -euo pipefail
          code=$(scripts/prod-http.sh get "${BASE}/" /tmp/home.html 'text/html')
          if [ "$code" != "200" ]; then
            echo "::error::${BASE} returned HTTP $code"
            exit 1
          fi
          grep -qi 'tuned' /tmp/home.html || { echo "::error::landing page body does not look like Tuned"; exit 1; }
          echo "${BASE}: HTTP 200, landing page rendered ($(wc -c < /tmp/home.html) bytes)"

      - name: Applications endpoint is deployed and refuses unauthenticated callers
        env:
          BASE: ${{ steps.vantage.outputs.base }}
        run: |
          set -euo pipefail
          # This route returns the applicant's own email, role and note, so a 200 here without a
          # key is a disclosure, not a degraded check — it fails loudly and asks for a rollback.
          #
          # A 404 is equally fatal and is the more likely failure: the route did not exist before
          # 7c94ad0, so 404 means this deploy is not serving the code that was pushed. That
          # transition is the same evidence run 2 used when /api/metrics went 404 -> 503, and it
          # is a stronger reading than "the site is up" because only a live deploy can produce it.
          code=$(scripts/prod-http.sh get "${BASE}/api/applications" /tmp/a.json 'application/json')
          case "$code" in
            401) echo "/api/applications without a key: HTTP 401 — ADMIN_KEY is set and the endpoint is closed." ;;
            503) echo "/api/applications without a key: HTTP 503 — ADMIN_KEY is not configured; endpoint fails closed." ;;
            200)
              echo "::error::/api/applications returned 200 with NO key — applicant addresses are public. Roll back."
              exit 1 ;;
            404)
              echo "::error::/api/applications returned 404 — the route is missing, so this deploy is not serving the pushed code."
              exit 1 ;;
            *)
              echo "::error::/api/applications returned unexpected HTTP $code"
              exit 1 ;;
          esac
          echo "Unauthenticated \`/api/applications\`: HTTP $code" >> "$GITHUB_STEP_SUMMARY"

      - name: The desk can be filled, and the route that fills it is deployed
        env:
          BASE: ${{ steps.vantage.outputs.base }}
        run: |
          set -euo pipefail
          # Run 176 shipped POST /:handle/desk because `follows` -- the sole source of everything
          # GET /today renders -- had exactly one writer in all of src/, the auto-follow selecting
          # the agents a member already owned. A member admitted through the front door owned
          # nothing, so the desk was empty and nothing in the product could add to it.
          #
          # This session has no egress to the site, so a workflow step is the only production
          # verification this loop gets, and "the site returns 200" would have been true even if
          # this route had not deployed at all. 404 -> 303 is the transition that proves it did,
          # the same reading run 2 took when /api/metrics went 404 -> 503.
          #
          # Deliberately inert. No cookie is sent, and the handler returns before it looks up the
          # feed or touches any counter -- the session check is its first act -- so this writes no
          # follows row and moves no `desk_follow` name. A 200 would mean the session gate is gone
          # and anyone can write to a member's desk, which is worth rolling back for on sight.
          code=$(scripts/prod-http.sh post "${BASE}/ava/desk")
          case "$code" in
            302|303) echo "Unauthenticated POST /ava/desk: HTTP $code -- route is live and refuses a caller with no session." ;;
            404)
              echo "::error::POST /ava/desk returned 404 -- the route is missing, so this deploy is not serving the pushed code."
              exit 1 ;;
            200)
              echo "::error::POST /ava/desk returned 200 with NO session -- anyone can write to a member's desk. Roll back."
              exit 1 ;;
            *)
              echo "::error::POST /ava/desk returned unexpected HTTP $code"
              exit 1 ;;
          esac
          echo "Unauthenticated \`POST /ava/desk\`: HTTP $code" >> "$GITHUB_STEP_SUMMARY"

      - name: Metrics endpoint refuses unauthenticated callers
        env:
          BASE: ${{ steps.vantage.outputs.base }}
        run: |
          set -euo pipefail
          code=$(scripts/prod-http.sh get "${BASE}/api/metrics" /tmp/m.json 'application/json')
          case "$code" in
            401) echo "/api/metrics without a key: HTTP 401 — key is set and the endpoint is closed." ;;
            503) echo "/api/metrics without a key: HTTP 503 — METRICS_KEY is not configured yet; endpoint fails closed." ;;
            200)
              echo "::error::/api/metrics returned 200 with NO key — aggregate data is public. Roll back."
              exit 1 ;;
            *)
              echo "::error::/api/metrics returned unexpected HTTP $code"
              exit 1 ;;
          esac
          # Recorded so the executor can read the METRICS_KEY state off the run summary
          # without a second request it has no egress for.
          echo "Unauthenticated \`/api/metrics\`: HTTP $code" >> "$GITHUB_STEP_SUMMARY"

      - name: Operator control plane refuses unauthenticated callers
        env:
          BASE: ${{ steps.vantage.outputs.base }}
        run: |
          set -euo pipefail
          # No key is sent. The plane must never answer with data to an anonymous caller —
          # it can create agent feeds and publish to them, so a 200 here is the one result
          # that is worth rolling back for on sight.
          code=$(scripts/prod-http.sh get "${BASE}/api/operator/agents" /tmp/op.json 'application/json')
          case "$code" in
            503) echo "/api/operator/agents without a key: HTTP 503 — AGENT_OPERATOR_KEY is not configured; the plane fails closed." ;;
            401) echo "/api/operator/agents without a key: HTTP 401 — the key is set and the plane is closed to anonymous callers." ;;
            200)
              echo "::error::/api/operator/agents returned 200 with NO key — the agent control plane is open. Roll back."
              exit 1 ;;
            *)
              echo "::error::/api/operator/agents returned unexpected HTTP $code"
              exit 1 ;;
          esac
          # The state of the owner bootstrap card, readable off the run summary by an
          # executor that has no egress to ask the question itself: 503 = not installed
          # yet, 401 = installed.
          echo "Unauthenticated \`/api/operator/agents\`: HTTP $code" >> "$GITHUB_STEP_SUMMARY"

      - name: Funnel pulse is deployed and refuses a foreign caller
        env:
          BASE: ${{ steps.vantage.outputs.base }}
        run: |
          set -euo pipefail
          # EXP-007's instrument. Two things have to be true of it in production and neither
          # can be read from here any other way: the route exists, and it will not write a
          # counter for a caller that is not the page.
          #
          # No Origin header is sent, so this request can never increment anything — the
          # refusal IS the assertion. 404 would mean the route is not deployed and EXP-007 is
          # reading zeros from an absence; 204 would mean the same-origin guard is gone and
          # anyone can write into the numbers this loop reasons from. Both are rollbacks.
          code=$(scripts/prod-http.sh post "${BASE}/api/pulse/landing_engage")
          case "$code" in
            403) echo "/api/pulse/landing_engage with no Origin: HTTP 403 — deployed, and it refuses to count a caller that is not the page." ;;
            204)
              echo "::error::/api/pulse/landing_engage accepted a POST with NO Origin — the counters are writable by anyone. Roll back."
              exit 1 ;;
            404)
              echo "::error::/api/pulse/landing_engage returned 404 — the EXP-007 instrument is not deployed; its zeros would mean nothing."
              exit 1 ;;
            *)
              echo "::error::/api/pulse/landing_engage returned unexpected HTTP $code"
              exit 1 ;;
          esac
          echo "Unauthenticated \`POST /api/pulse/landing_engage\`: HTTP $code" >> "$GITHUB_STEP_SUMMARY"

      # EXP-011's Fork R-D is "the beacon never landed in production", and it is registered as
      # an expected outcome because this loop has shipped four instruments that silently wrote
      # nothing (L-35, L-44, L-46, L-51). Every one of them was found *after* a window closed,
      # by which time the days were spent and unrecoverable — counters do not backfill.
      #
      # So the two halves are asserted here, on every push, against the document justtuned.com
      # actually serves: the route accepts the name (404 = not allowlisted, and R is undefined
      # for fourteen days before anyone notices), and the landing page still ships the call
      # (present = the numerator can be written; absent = the route is fine and no browser will
      # ever reach it, which reads identically to nobody arriving).
      #
      # The route half sends NO Origin and therefore cannot increment anything: 403 is the pass,
      # exactly as for landing_engage above. A 404 here distinguishes "not deployed" from
      # "deployed and refusing", which is the whole point — an unallowlisted name 404s.
      - name: EXP-011 render beacon is deployed and reachable from the page
        env:
          BASE: ${{ steps.vantage.outputs.base }}
        run: |
          set -euo pipefail
          code=$(scripts/prod-http.sh post "${BASE}/api/pulse/landing_render")
          case "$code" in
            403) echo "/api/pulse/landing_render with no Origin: HTTP 403 — allowlisted, and refusing a caller that is not the page." ;;
            404)
              echo "::error::/api/pulse/landing_render returned 404 — landing_render is not on the allowlist in production. EXP-011 would grade Fork R-D on an absence. Roll back."
              exit 1 ;;
            204)
              echo "::error::/api/pulse/landing_render accepted a POST with NO Origin — the same-origin guard is gone. Roll back."
              exit 1 ;;
            *)
              echo "::error::/api/pulse/landing_render returned unexpected HTTP $code"
              exit 1 ;;
          esac
          code=$(scripts/prod-http.sh get "${BASE}/" /tmp/landing.html 'text/html')
          [ "$code" = "200" ] || { echo "::error::/ returned HTTP $code"; exit 1; }
          grep -q 'pulse("landing_render")' /tmp/landing.html || {
            echo "::error::the landing page no longer fires landing_render — the route is live and nothing will ever call it. EXP-011's numerator is unwritable. Roll back."
            exit 1
          }
          echo "Landing page ships \`pulse(\"landing_render\")\`; route answers 403 unauthenticated." >> "$GITHUB_STEP_SUMMARY"

      # The same two halves as the step above, one page along. A pulse name is allowlisted in
      # one Set and called from one page, and the two can part company without anything going
      # red: `landing_render` did exactly that at run 138 and was only caught at run 140. The
      # cost here is smaller than EXP-011's — no window closes on it — but the failure is the
      # same shape and reads the same way, as a rung that is simply always zero.
      - name: Follow funnel beacon is deployed and reachable from the feed page
        env:
          BASE: ${{ steps.vantage.outputs.base }}
        run: |
          set -euo pipefail
          code=$(scripts/prod-http.sh post "${BASE}/api/pulse/follow_open")
          case "$code" in
            403) echo "/api/pulse/follow_open with no Origin: HTTP 403 — allowlisted, and refusing a caller that is not the page." ;;
            404)
              echo "::error::/api/pulse/follow_open returned 404 — follow_open is not on the allowlist in production. The rung between a feed view and a follow would read zero forever. Roll back."
              exit 1 ;;
            204)
              echo "::error::/api/pulse/follow_open accepted a POST with NO Origin — the same-origin guard is gone. Roll back."
              exit 1 ;;
            *)
              echo "::error::/api/pulse/follow_open returned unexpected HTTP $code"
              exit 1 ;;
          esac
          # Read from the feed page the distribution candidates point at, not from any feed:
          # the button and the beacon have to be on the document a listing would send people to.
          code=$(scripts/prod-http.sh get "${BASE}/sportstech" /tmp/feedpage.html 'text/html')
          [ "$code" = "200" ] || { echo "::error::/sportstech returned HTTP $code"; exit 1; }
          grep -q 'id="follow-btn"' /tmp/feedpage.html || {
            echo "::error::/sportstech no longer carries a follow button — the only conversion action on the page is gone. Roll back."
            exit 1
          }
          grep -q '/api/pulse/follow_open' /tmp/feedpage.html || {
            echo "::error::/sportstech no longer fires follow_open — the route is live and nothing will ever call it. Roll back."
            exit 1
          }
          echo "Feed page ships the follow button and \`follow_open\`; route answers 403 unauthenticated." >> "$GITHUB_STEP_SUMMARY"

      # Shipped in the same commit as the counter rather than a run behind it, which is the whole
      # of the run-138/140 lesson: `landing_render` was live for two days with the only check able
      # to see it broken, and `follow_open` went a run without a gate. `feed_render` is the rung
      # under everything a distribution listing would produce — a feed view that no browser
      # rendered — so a detached beacon here reads as "nobody came" on exactly the day someone did.
      - name: Feed render beacon is deployed and reachable from the feed page
        env:
          BASE: ${{ steps.vantage.outputs.base }}
        run: |
          set -euo pipefail
          code=$(scripts/prod-http.sh post "${BASE}/api/pulse/feed_render")
          case "$code" in
            403) echo "/api/pulse/feed_render with no Origin: HTTP 403 — allowlisted, and refusing a caller that is not the page." ;;
            404)
              echo "::error::/api/pulse/feed_render returned 404 — feed_render is not on the allowlist in production. Every feed view would stay unattributable to a browser. Roll back."
              exit 1 ;;
            204)
              echo "::error::/api/pulse/feed_render accepted a POST with NO Origin — the same-origin guard is gone. Roll back."
              exit 1 ;;
            *)
              echo "::error::/api/pulse/feed_render returned unexpected HTTP $code"
              exit 1 ;;
          esac
          # /tmp/feedpage.html is the document fetched by the step above — the feed page both open
          # distribution items point at, not any feed.
          grep -q '/api/pulse/feed_render' /tmp/feedpage.html || {
            echo "::error::/sportstech no longer fires feed_render — the route is live and nothing will ever call it. Roll back."
            exit 1
          }
          # The landing page must not have grown it: `landing_view` is EXP-011's denominator and a
          # feed-page pulse firing on `/` would contaminate a pre-registered window mid-flight.
          if grep -q 'feed_render' /tmp/landing.html; then
            echo "::error::the landing page emits feed_render — EXP-011's surface is no longer the one it was registered against. Roll back."
            exit 1
          fi
          echo "Feed page ships \`feed_render\`; route answers 403 unauthenticated; landing page is free of it." >> "$GITHUB_STEP_SUMMARY"

      - name: Public pages still render
        env:
          BASE: ${{ steps.vantage.outputs.base }}
        run: |
          set -euo pipefail
          for path in /terms /privacy; do
            code=$(scripts/prod-http.sh get "${BASE}${path}" /tmp/legal.html 'text/html')
            [ "$code" = "200" ] || { echo "::error::${path} returned HTTP $code"; exit 1; }
            # 16d522b replaced the owner's personal Gmail on these pages with a role
            # address, and shipped without anything able to confirm it — the edge was
            # challenging every reader that day. A contact address that silently reverts
            # or 404s is a privacy regression, so it is asserted here rather than assumed.
            grep -q 'legal@justtuned.com' /tmp/legal.html || { echo "::error::${path} does not show the role contact address"; exit 1; }
            if grep -qE '[A-Za-z0-9._%+-]+@gmail\.com' /tmp/legal.html; then
              echo "::error::${path} exposes a personal Gmail address"
              exit 1
            fi
            echo "${path}: HTTP 200, contact is legal@justtuned.com, no personal address"
          done

      # Run 172 learned to grade a disclosure on the deployed page and not only in workerd
      # (445f980). This is that lesson applied to the one this service is least able to keep.
      #
      # The Worker has no mail binding, no mail secret and no call to any mail provider, and until
      # 3550684 two public pages said otherwise: / promised "you'll hear back by email" and /login
      # promised "we send you a personal sign-in link". test/promises.test.ts asserts the fix
      # against a real Worker in workerd. This asserts it against the thing actually serving
      # justtuned.com, which is a different claim — a unit test cannot see a bad deploy, a reverted
      # commit, or an edge that rewrites the document.
      #
      # Both directions, for the reason the unit test gives: the promise must be absent AND the
      # disclosure must be present, because a page that silently dropped the honest sentence would
      # pass a one-directional check while telling an applicant nothing at all. ops/LESSONS.md L-93.
      - name: No public page promises email the Worker cannot send
        env:
          BASE: ${{ steps.vantage.outputs.base }}
        run: |
          set -euo pipefail
          for path in / /login; do
            code=$(scripts/prod-http.sh get "${BASE}${path}" /tmp/promise.html 'text/html')
            [ "$code" = "200" ] || { echo "::error::${path} returned HTTP $code"; exit 1; }
            if grep -qiE "we'?l?l? ?(will )?send you|we'?l?l? ?(will )?email you|hear back by email|check your inbox" /tmp/promise.html; then
              echo "::error::${path} promises email, and this Worker has no sender. Roll back."
              exit 1
            fi
            grep -qiE 'sends no automated email' /tmp/promise.html || {
              echo "::error::${path} no longer discloses that no email is sent"; exit 1; }
            echo "${path}: HTTP 200, promises no email, discloses that none is sent"
          done

      # A feed page that stops announcing its feed is a distribution regression, and it is
      # the exact regression that went unnoticed for the product's whole operating life:
      # until 2026-08-25 no page here carried <link rel="alternate">, so every feed reader,
      # aggregator and blog directory that ever loaded one was told this site has no feed.
      # Nobody caught it because the page carries a visible "RSS" anchor a human can click,
      # and a human reviewing the page sees a feed link either way (ops/LESSONS.md L-46).
      #
      # test/discovery.test.ts asserts this against a real Worker in workerd. This asserts
      # it against the thing actually serving justtuned.com, which is a different claim —
      # the unit test cannot see a bad deploy, a reverted commit or an edge that rewrites
      # the document. It is also this change's standing rollback signal.
      #
      # Deliberately /ava: an existing feed this job already reads, on the one RSS route
      # anything here fetches on a schedule. /sportstech is NOT probed — inside EXP-009
      # Reading 1's window that would make Fork I-A true by construction (L-31), and the
      # scheduled probe for it is pre-committed for after 2026-08-26, not before.
      - name: Public feed page announces its feed to software
        env:
          BASE: ${{ steps.vantage.outputs.base }}
        run: |
          set -euo pipefail
          code=$(scripts/prod-http.sh get "${BASE}/ava" /tmp/feed.html 'text/html')
          [ "$code" = "200" ] || { echo "::error::/ava returned HTTP $code"; exit 1; }

          # Each <link rel=alternate> is extracted as its own match, then filtered on the
          # media type, so both attributes must be on the *same element*. Grepping the whole
          # document for the two strings separately would pass on a page carrying
          # rel="alternate" on one element and the RSS type on another — and the document is
          # served as a single line, so there is no line boundary doing that work for free.
          # A <link rel=alternate> without the RSS media type is invisible to every client
          # that matters, which is why the type is not assumed.
          link=$(grep -o '<link[^>]*rel="alternate"[^>]*>' /tmp/feed.html | grep -F 'type="application/rss+xml"' | head -1 || true)
          [ -n "$link" ] || { echo "::error::/ava carries no <link rel=alternate type=application/rss+xml> — feed readers cannot discover this feed"; exit 1; }

          href=$(printf '%s' "$link" | sed -n 's/.*href="\([^"]*\)".*/\1/p')
          [ "$href" = "/ava/rss.xml" ] || { echo "::error::/ava advertises href '$href', expected /ava/rss.xml"; exit 1; }

          # The assertion that matters: follow what the page advertises and require a feed
          # back. A well-formed link pointing at a 404 fails exactly the same way as no link.
          fcode=$(scripts/prod-http.sh get "${BASE}${href}" /tmp/advertised.xml 'application/rss+xml')
          [ "$fcode" = "200" ] || { echo "::error::advertised feed ${href} returned HTTP $fcode"; exit 1; }
          grep -q '<rss' /tmp/advertised.xml || { echo "::error::advertised feed ${href} is not an RSS document"; exit 1; }

          # The feed document's own canonical address. The page saying where its feed is and
          # the feed saying which URL it is are two different claims, and only the first was
          # ever checked. Three hosts serve this identical XML, so a self link built from the
          # request would make the canonical whatever asked for it — the defect, not the fix.
          #
          # THE VANTAGE IS WHAT GIVES THIS TEETH. When the zone challenges this job, BASE is
          # the workers.dev origin, and a request-derived self link would come back naming
          # that host. Asserting the canonical unconditionally therefore fails loudly on the
          # exact run where the regression would otherwise be invisible.
          grep -q 'xmlns:atom="http://www.w3.org/2005/Atom"' /tmp/advertised.xml \
            || { echo "::error::${href} declares no atom namespace — its self link resolves to no namespace at all"; exit 1; }
          shref=$(grep -o '<atom:link[^>]*rel="self"[^>]*>' /tmp/advertised.xml | head -1 | sed -n 's/.*href="\([^"]*\)".*/\1/p')
          [ "$shref" = "https://justtuned.com/ava/rss.xml" ] \
            || { echo "::error::${href} names itself '$shref', expected https://justtuned.com/ava/rss.xml (fetched via ${BASE})"; exit 1; }

          # The freshness promise, machine-readable. A4 in ops/DISTRIBUTION.md turns on whether
          # the destination is current when a stranger arrives; this is the element a reader's
          # "last updated" column shows. It must be a date — the string `Invalid Date` used to
          # be a reachable output of this document and is a false statement, not a missing one.
          built=$(grep -o '<lastBuildDate>[^<]*</lastBuildDate>' /tmp/advertised.xml | head -1 | sed 's/<[^>]*>//g')
          if [ -n "$built" ]; then
            date -u -d "$built" >/dev/null 2>&1 \
              || { echo "::error::${href} states a build date that is not a date: '$built'"; exit 1; }
            echo "${href}: last built ${built}"
          else
            # Legal and meaningful: a feed with no items has no build date. It is reported
            # rather than passed over, because on /ava it would mean the feed had emptied.
            echo "::notice::${href} states no lastBuildDate — the feed carries no dated item"
          fi

          echo "/ava: autodiscovery present, advertises ${href}, that URL serves RSS, and it names itself ${shref}"

      # The same class of regression as the step above, on the same page, for everything that
      # is not a feed reader. A public feed page is the destination of every distribution link
      # this product will ever post; if it stops carrying Open Graph, every one of those links
      # silently degrades to bare text in Slack, Discord, Mastodon, X and iMessage, and nothing
      # visible on the page changes — which is exactly why run 86's defect survived a year of
      # human review. test/sharing.test.ts asserts this against a real Worker in workerd; this
      # asserts it against the thing serving justtuned.com, and is the change's standing
      # rollback signal.
      #
      # Reuses /tmp/feed.html from the step above rather than re-fetching: a second GET would
      # add a feed_view_bot:ava this job does not need.
      - name: Public feed page describes itself to link unfurlers and crawlers
        env:
          BASE: ${{ steps.vantage.outputs.base }}
        run: |
          set -euo pipefail

          # Same single-element discipline as the autodiscovery step: extract each tag whole,
          # then read its own attributes. Grepping the document for two strings separately
          # would pass on a page carrying the name on one tag and the content on another, and
          # the document is served as one line so no line boundary does that work for free.
          # No `head` anywhere in these pipelines on purpose: under `pipefail` it closes the
          # pipe on a still-writing grep and the SIGPIPE becomes a failure of the whole
          # extraction. `sed -n '1s///p'` takes the first match without ever doing that.
          metaof() {
            grep -o '<meta[^>]*>' /tmp/feed.html \
              | { grep -E "(name|property)=\"$1\"" || true; } \
              | sed -n '1s/.*content="\([^"]*\)".*/\1/p'
          }

          for key in og:type og:site_name og:title og:description og:url og:image description twitter:card; do
            [ -n "$(metaof "$key")" ] || { echo "::error::/ava carries no $key — the link unfurls as bare text and the search snippet is scraped"; exit 1; }
          done

          # Three origins serve this identical document (justtuned.com, www.justtuned.com and
          # the workers.dev subdomain), so the canonical is the only thing naming which URL is
          # the page. It must not track the host this job happened to read from.
          canon=$(grep -o '<link[^>]*rel="canonical"[^>]*>' /tmp/feed.html | sed -n '1s/.*href="\([^"]*\)".*/\1/p' || true)
          [ "$canon" = "https://justtuned.com/ava" ] || { echo "::error::/ava canonical is '$canon', expected https://justtuned.com/ava"; exit 1; }
          ogurl=$(metaof og:url)
          [ "$ogurl" = "https://justtuned.com/ava" ] || { echo "::error::/ava og:url is '$ogurl', expected https://justtuned.com/ava"; exit 1; }

          # The card image, followed. A relative og:image resolves against the *unfurler's*
          # origin rather than ours — the same defect meta.test.ts pins for item images — and
          # an absolute one pointing at a 404 renders exactly like no image at all.
          ogimg=$(metaof og:image)
          case "$ogimg" in
            https://justtuned.com/*) ;;
            *) echo "::error::/ava og:image is '$ogimg', which is not an absolute URL on the canonical origin"; exit 1 ;;
          esac
          # Asserted as canonical, but fetched through the vantage in use, so this step still
          # runs when the zone is challenging clients.
          imgpath=${ogimg#https://justtuned.com}
          icode=$(scripts/prod-http.sh get "${BASE}${imgpath}" /tmp/ogimage.bin 'image/*')
          [ "$icode" = "200" ] || { echo "::error::og:image ${imgpath} returned HTTP $icode"; exit 1; }
          # Magic number, not a content-type header: an edge that serves an HTML error page
          # with the wrong header would pass a header check and render nothing.
          head -c 8 /tmp/ogimage.bin | grep -qa 'PNG' || { echo "::error::og:image ${imgpath} is not a PNG"; exit 1; }

          echo "/ava: canonical ${canon}, og:url ${ogurl}, og:image ${imgpath} serves a PNG, card=$(metaof twitter:card)"

      # The same class of defect as the two steps above, one layer out: what this site tells a
      # reader that never loads a page at all. test/crawl.test.ts asserts it against a real
      # Worker in workerd; this asserts it against the thing serving justtuned.com, and is the
      # change's standing rollback signal.
      #
      # Two failures are worth rolling back on sight and neither is visible to a human opening
      # the site: a `Disallow: /` served on the canonical host would ask every crawler to drop
      # the entire product from its index, and a missing `X-Robots-Tag` on /studio/ means a
      # capability URL that leaked through a paste or a referrer is indexable.
      - name: Crawl policy is deployed, host-aware, and not blocking the site
        env:
          BASE: ${{ steps.vantage.outputs.base }}
          VANTAGE: ${{ steps.vantage.outputs.vantage }}
        run: |
          set -euo pipefail

          # A directive value, one per line, with the name stripped. No `head` in these
          # pipelines: under `pipefail` it closes the pipe on a still-writing grep and the
          # SIGPIPE fails the extraction rather than the assertion.
          field() { grep -i "^[[:space:]]*$1:" "$2" | sed "s/^[^:]*:[[:space:]]*//" | tr -d '\r' || true; }

          code=$(scripts/prod-http.sh get "${BASE}/robots.txt" /tmp/robots.txt 'text/plain')
          [ "$code" = "200" ] || { echo "::error::/robots.txt returned HTTP $code — an absent robots.txt is read as 'crawl everything', /studio/<token> included"; exit 1; }
          disallow=$(field Disallow /tmp/robots.txt)
          sitemap=$(field Sitemap /tmp/robots.txt)

          if [ "$VANTAGE" = "public" ]; then
            # The canonical host. The site must be crawlable and must advertise its sitemap.
            if printf '%s\n' "$disallow" | grep -qx '/'; then
              echo "::error::robots.txt on the canonical host carries 'Disallow: /' — this asks every crawler to drop the entire site. Roll back."
              exit 1
            fi
            [ "$sitemap" = "https://justtuned.com/sitemap.xml" ] || { echo "::error::robots.txt advertises sitemap '$sitemap', expected https://justtuned.com/sitemap.xml"; exit 1; }
            for p in /studio/ /enter/ /api/; do
              printf '%s\n' "$disallow" | grep -qx -- "$p" || { echo "::error::robots.txt does not disallow $p"; exit 1; }
            done

            # Host-awareness, proved rather than assumed: the same Worker on its workers.dev
            # route is a duplicate origin with no public purpose, and must block. This is the
            # one assertion a single-host check cannot make.
            ocode=$(scripts/prod-http.sh get "$(scripts/prod-http.sh origin)/robots.txt" /tmp/robots-origin.txt 'text/plain')
            [ "$ocode" = "200" ] || { echo "::error::robots.txt on the workers.dev origin returned HTTP $ocode"; exit 1; }
            [ "$(field Disallow /tmp/robots-origin.txt)" = "/" ] || { echo "::error::the workers.dev origin does not block crawling — it is a duplicate of the whole site"; exit 1; }
            echo "robots.txt: canonical host crawlable, sitemap advertised, workers.dev origin blocked"
          else
            # Reading from the origin because the zone is challenging clients. Then the
            # blocking policy is the correct answer and the permissive one would be the bug.
            [ "$disallow" = "/" ] || { echo "::error::the workers.dev origin served '$disallow' instead of blocking; it is a duplicate of the whole site"; exit 1; }
            [ -z "$sitemap" ] || { echo "::error::a non-canonical host advertised a sitemap ('$sitemap')"; exit 1; }
            echo "robots.txt: workers.dev origin blocks crawling (zone unreachable, canonical policy not checked this run)"
          fi

          # The half a Disallow cannot do. A crawler that learned a capability URL from a paste
          # or a referrer never fetches robots.txt for it; only this header refuses the index.
          # The token is deliberately not a real one — the route 404s and writes no counter.
          hcode=$(scripts/prod-http.sh headers "${BASE}/studio/not-a-real-token" /tmp/studio.h 'text/html')
          [ "$hcode" = "404" ] || { echo "::error::/studio/<bad token> returned HTTP $hcode, expected 404"; exit 1; }
          # `|| true`: with the header absent — the regression this is here to catch — grep exits
          # 1, pipefail propagates it, and `set -e` would kill the step before it could say why.
          tag=$(grep -i '^x-robots-tag:' /tmp/studio.h | sed -n '1s/^[^:]*:[[:space:]]*//p' | tr -d '\r' || true)
          case "$tag" in
            *noindex*) echo "/studio/<token>: HTTP 404 with x-robots-tag '$tag'" ;;
            *) echo "::error::/studio/<token> carries x-robots-tag '$tag' — a leaked capability URL is indexable. Roll back."; exit 1 ;;
          esac

          scode=$(scripts/prod-http.sh get "${BASE}/sitemap.xml" /tmp/sitemap.xml 'application/xml')
          [ "$scode" = "200" ] || { echo "::error::/sitemap.xml returned HTTP $scode"; exit 1; }
          grep -q '<urlset' /tmp/sitemap.xml || { echo "::error::/sitemap.xml is not a sitemap document"; exit 1; }
          # Every URL must be on the canonical origin no matter which host served the document,
          # for the same reason the canonical tag must not track the requesting host.
          bad=$(grep -o '<loc>[^<]*</loc>' /tmp/sitemap.xml | sed 's/<[^>]*>//g' | { grep -v '^https://justtuned\.com/' || true; })
          [ -z "$bad" ] || { echo "::error::sitemap advertises URLs off the canonical origin: $bad"; exit 1; }
          n=$(grep -c '<loc>' /tmp/sitemap.xml || true)
          grep -q '<loc>https://justtuned.com/</loc>' /tmp/sitemap.xml || { echo "::error::sitemap does not list the landing page"; exit 1; }
          echo "/sitemap.xml: HTTP 200, $n URLs, all on the canonical origin"
          echo "Crawl policy: robots.txt served, \`/studio/\` noindex, sitemap lists $n canonical URLs" >> "$GITHUB_STEP_SUMMARY"

      # A published find is addressable, and the sitemap is telling the truth about it.
      #
      # Version identity proves the deploy and not that any particular route answers (L-35), and
      # this route is the one the previous step's URL count now depends on: the sitemap grew from
      # eight entries to one per published find, so a sitemap full of addresses that 404 would be
      # WORSE than the eight it replaced — it would be this service advertising broken URLs to
      # every crawler that reads it.
      #
      # The find is chosen from the sitemap the site itself just served rather than hard-coded, so
      # this cannot pass by testing an id that happens to survive while the query behind the
      # document is broken. A 404 is fatal on the same reasoning run 2 used when /api/metrics went
      # 404 -> 503: find pages did not exist before this commit, so 404 means either the deploy is
      # not serving the pushed code or the sitemap is advertising URLs that are not there.
      - name: A published find is addressable, and the sitemap does not advertise 404s
        env:
          BASE: ${{ steps.vantage.outputs.base }}
        run: |
          set -euo pipefail
          # The first <loc> of the form https://justtuned.com/<handle>/<digits>.
          find_url=$(grep -o '<loc>[^<]*</loc>' /tmp/sitemap.xml \
            | sed 's/<[^>]*>//g' \
            | { grep -E '^https://justtuned\.com/[a-z0-9-]+/[0-9]+$' || true; } \
            | sed -n '1p')
          if [ -z "$find_url" ]; then
            echo "::error::the sitemap advertises no find pages — /<handle>/<id> is either not deployed or publishing nothing. The one arrival channel that needs no owner action is offering eight documents again."
            exit 1
          fi
          path=${find_url#https://justtuned.com}
          code=$(scripts/prod-http.sh get "${BASE}${path}" /tmp/find.html 'text/html')
          case "$code" in
            200) ;;
            404)
              echo "::error::${path} is listed in the sitemap and returns 404 — this deploy is advertising broken URLs to every crawler that reads it. Roll back."
              exit 1 ;;
            *)
              echo "::error::${path} returned unexpected HTTP $code"
              exit 1 ;;
          esac
          # It has to be a find page and not a feed page served by a route-order accident: only
          # this surface carries the provenance block, and only this surface states the boundary
          # that keeps it a record of attention rather than a copy of the thing attended to.
          grep -q 'class="provenance"' /tmp/find.html \
            || { echo "::error::${path} carries no provenance block — it is not a find page"; exit 1; }
          grep -q 'Tuned does not host this and did not write it' /tmp/find.html \
            || { echo "::error::${path} no longer states that Tuned does not host the source. Roll back."; exit 1; }
          # The canonical must name the find, not the host that answered, for the same reason the
          # feed page's must: three origins serve this identical document.
          canon=$(grep -o '<link[^>]*rel="canonical"[^>]*>' /tmp/find.html | sed -n '1s/.*href="\([^"]*\)".*/\1/p' || true)
          [ "$canon" = "$find_url" ] \
            || { echo "::error::${path} declares canonical '$canon', expected ${find_url}"; exit 1; }
          finds=$(grep -o '<loc>[^<]*</loc>' /tmp/sitemap.xml | sed 's/<[^>]*>//g' \
            | { grep -cE '^https://justtuned\.com/[a-z0-9-]+/[0-9]+$' || true; })
          # The count goes to STDOUT and not only to the step summary. Run 163 wrote a
          # discriminating value to the summary alone and then could not read it back — this
          # session has no egress to fetch a run page, and the summary is not in the job log. The
          # next run reads this line out of the log, so it belongs in the log.
          echo "${path}: HTTP 200, provenance block present, canonical ${canon}; ${finds} find pages in the sitemap"
          echo "Find pages: ${finds} in the sitemap; \`${path}\` serves one" >> "$GITHUB_STEP_SUMMARY"

      # The edge INTO the find pages, which is a different claim from the one above.
      #
      # The step above proves a find page exists and that the sitemap points at it. It says nothing
      # about whether anything a crawler can *walk to* points at it, and for one day nothing did:
      # run 164 shipped eighty-seven addresses whose only inbound route was sitemap.xml, because
      # every card on a feed page is an anchor to the source. A set of pages that link only to each
      # other and are reachable from no other page is an island, and the sitemap alone does not
      # make it one a crawler will treat as part of this site. It is also the visitor-facing half:
      # without a link on the page that shows the find, nobody can obtain a find's URL to send.
      #
      # This regresses silently and invisibly — the feed page renders identically whether or not
      # the permalink is there — so it is asserted here rather than left to the unit suite, which
      # cannot see production. The handle is taken from the sitemap rather than hard-coded, for the
      # same reason the step above takes the find that way.
      # The conversion action on the surface this site is indexed and shared as. A find page is the
      # unit search results and pasted links point at — eighty-seven of them against five feed
      # pages — so the check that the feed page's follow button is still there has an exact twin
      # here, and the find page needs it more: nothing else on that page offers a subscription
      # except a 12px link to raw XML.
      #
      # The counter names are checked by name and not merely by prefix. `find_follow_rss` contains
      # `follow_rss`, so a prefix test would pass on a page emitting the feed page's counters —
      # which is precisely the regression this step exists to catch, since routing a second
      # surface into `follow_open` silently changes what a running number means.
      - name: Follow affordance is deployed on a find page, under its own counter names
        env:
          BASE: ${{ steps.vantage.outputs.base }}
        run: |
          set -euo pipefail
          for name in find_follow_open find_follow_rss; do
            code=$(scripts/prod-http.sh post "${BASE}/api/pulse/${name}")
            case "$code" in
              403) echo "/api/pulse/${name} with no Origin: HTTP 403 — allowlisted, and refusing a caller that is not the page." ;;
              404)
                echo "::error::/api/pulse/${name} returned 404 — it is not on the allowlist in production, so the find page's follow rung would read zero forever. Roll back."
                exit 1 ;;
              204)
                echo "::error::/api/pulse/${name} accepted a POST with NO Origin — the same-origin guard is gone. Roll back."
                exit 1 ;;
              *)
                echo "::error::/api/pulse/${name} returned unexpected HTTP $code"
                exit 1 ;;
            esac
          done
          # Read a real published find, discovered from the feed page rather than hard-coded: an id
          # pinned here would go stale the first time that item is hidden, and the step would then
          # fail for a reason that has nothing to do with the follow block.
          code=$(scripts/prod-http.sh get "${BASE}/sportstech" /tmp/follow-feed.html 'text/html')
          [ "$code" = "200" ] || { echo "::error::/sportstech returned HTTP $code"; exit 1; }
          find=$(grep -o 'class="card-permalink" href="/[a-z0-9-]*/[0-9]*"' /tmp/follow-feed.html \
            | sed -n 's|.*href="\([^"]*\)".*|\1|p' | sort -u | sed -n '1p')
          [ -n "$find" ] || { echo "::error::/sportstech offers no find permalink to check"; exit 1; }
          code=$(scripts/prod-http.sh get "${BASE}${find}" /tmp/follow-find.html 'text/html')
          [ "$code" = "200" ] || { echo "::error::${find} returned HTTP $code"; exit 1; }
          grep -q 'id="follow-btn"' /tmp/follow-find.html || {
            echo "::error::${find} no longer carries a follow button — the most-indexed page on this site is a dead end again. Roll back."
            exit 1
          }
          grep -q 'id="follow-dlg"' /tmp/follow-find.html || {
            echo "::error::${find} has a follow button and no dialog for it to open. Roll back."
            exit 1
          }
          grep -q '/api/pulse/find_follow_open' /tmp/follow-find.html || {
            echo "::error::${find} no longer fires find_follow_open — the route is live and nothing will ever call it. Roll back."
            exit 1
          }
          # The feed page's own counters must not appear here. This is the separation, checked on
          # the served document rather than trusted from the source.
          if grep -oE '/api/pulse/[a-z_]+' /tmp/follow-find.html | grep -qxE '/api/pulse/(follow_open|follow_rss|feed_render)'; then
            echo "::error::${find} emits a feed-page counter. follow_open's denominator is feed_render, which a find page cannot emit — this silently redefines a running number. Roll back."
            exit 1
          fi
          # And the source link must still outrank the follow ask, on the served page.
          cta=$(grep -bo '<a class="btn primary open-cta"' /tmp/follow-find.html | sed -n '1s/:.*//p')
          btn=$(grep -bo '<button class="btn primary" id="follow-btn"' /tmp/follow-find.html | sed -n '1s/:.*//p')
          [ -n "$cta" ] || { echo "::error::${find} has no outbound CTA to the source. Roll back."; exit 1; }
          [ "$cta" -lt "$btn" ] || {
            echo "::error::on ${find} the follow ask now precedes the link to the source. Tuned's job is to send people to the thing that was attended to. Roll back."
            exit 1
          }
          # Run 172. The follow ask must state how long ago that feed last published, on the
          # served document. Four of five feeds have published nothing since 30 July, and the
          # ask is the only conversion a stranger can complete here — offering it without the
          # age spends that conversion on a stream with nothing coming.
          #
          # The age itself is not asserted: it changes every day, and a check pinning a number
          # would fail for the passage of time rather than for a regression. What is asserted
          # is the SHAPE — a recognised age phrase, in place, on both surfaces. Both documents
          # are already in hand from the fetches above, so this adds no request.
          #
          # Matched as one uninterrupted run through to the sentence after it, which is the
          # property and not the prose: `.find-follow .ff-copy b` is `display: block`, so any
          # markup reintroduced around the age breaks this sentence across three lines with the
          # full stop orphaned — and nothing overflows when it does, so no overflow check sees
          # it. This regex is what does.
          age='(today|yesterday|[0-9]+ days ago)'
          grep -qE "as it is published — the last was ${age}\. No account" /tmp/follow-find.html || {
            echo "::error::${find} no longer states when @$(printf '%s' "$find" | cut -d/ -f2) last published, or has markup splitting the sentence. The follow ask is a promise again. Roll back."
            exit 1
          }
          grep -qE "publishes them — the last was ${age}\." /tmp/follow-find.html || {
            echo "::error::${find}'s follow dialog no longer states when the feed last published. Roll back."
            exit 1
          }
          grep -qE "publishes them — the last was ${age}\." /tmp/follow-feed.html || {
            echo "::error::/sportstech's follow dialog no longer states when the feed last published. Roll back."
            exit 1
          }
          echo "Cadence disclosed: $(grep -oE "the last was ${age}" /tmp/follow-find.html | head -1) on ${find}."

          echo "Find page ${find} ships the follow block under \`find_follow_*\`, no feed-page counter, source link still first, and states the feed's publishing age." >> "$GITHUB_STEP_SUMMARY"

      # The follow dialog on a feed page and on a find page now offers a signed-in member the
      # desk subscription instead of only the email capture. That half is member-only by
      # construction and cannot be read from here: this job holds no session and will not mint a
      # production member to obtain one. It is graded in workerd by test/activation.test.ts, and
      # the fact that it shipped is established by the expected-commit gate at the top of this
      # job — not by a body check. Said plainly rather than dressed up as a production reading of
      # the feature.
      #
      # What IS checkable from here is the invariant the change rests on, and it is the half that
      # can hurt: **a caller with no session must get the same public document as before.** These
      # two pages are the surfaces this site is indexed and shared as, and EXP-011's denominator is
      # counted on them. If a member-only control ever renders anonymously, then every crawler,
      # unfurler and shared cache in front of this Worker is being handed member state, and the
      # anonymous document stops being the one that was measured.
      #
      # Both documents are already in hand from the step above, so this adds no request — the same
      # reason that step gives for reading the cadence off files it already fetched. The
      # `cache-control: private` half of the change is asserted in workerd rather than here: it
      # guards an edge rewriting the response, which this change does not introduce, and checking
      # it would cost two more first-party fetches of a feed whose counters this loop reads.
      #
      # Guarded against the vacuous pass run 175 caught: the dialog is asserted present first, so
      # an empty or error body fails at that line rather than sailing through two negative greps
      # that find nothing because there is nothing there.
      - name: A signed-out visitor gets no member controls on the public pages
        run: |
          set -euo pipefail
          check_anonymous() {
            local path="$1" file="$2"
            grep -q 'id="follow-dlg"' "$file" \
              || { echo "::error::${path} carries no follow dialog — the checks below would pass on nothing"; exit 1; }
            if grep -qE 'action="/[a-z0-9-]+/desk"' "$file"; then
              echo "::error::${path} offers a desk form to a caller with NO session. The public document now varies by member state for everybody, crawlers and caches included. Roll back."
              exit 1
            fi
            if grep -qiE 'is on your desk|Add to my desk' "$file"; then
              echo "::error::${path} shows member-only desk copy to an anonymous caller. Roll back."
              exit 1
            fi
            echo "${path}: follow dialog present, no desk form, no member copy"
          }
          check_anonymous /sportstech /tmp/follow-feed.html
          check_anonymous "find page" /tmp/follow-find.html
          echo "Signed-out feed and find pages carry no member controls" >> "$GITHUB_STEP_SUMMARY"

      - name: A find page can be reached from the feed page, not only from the sitemap
        env:
          BASE: ${{ steps.vantage.outputs.base }}
        run: |
          set -euo pipefail
          handle=$(grep -o '<loc>[^<]*</loc>' /tmp/sitemap.xml \
            | sed 's/<[^>]*>//g' \
            | { grep -E '^https://justtuned\.com/[a-z0-9-]+/[0-9]+$' || true; } \
            | sed -n '1s|^https://justtuned\.com/\([a-z0-9-]*\)/.*|\1|p')
          if [ -z "$handle" ]; then
            echo "::error::no find page in the sitemap to take a handle from"
            exit 1
          fi
          code=$(scripts/prod-http.sh get "${BASE}/${handle}" /tmp/feed-inbound.html 'text/html')
          [ "$code" = "200" ] || { echo "::error::/${handle} returned HTTP $code"; exit 1; }
          # Every permalink the feed page emits, as paths.
          links=$(grep -o 'class="card-permalink" href="/[a-z0-9-]*/[0-9]*"' /tmp/feed-inbound.html \
            | sed -n 's|.*href="\([^"]*\)".*|\1|p' | sort -u)
          n=$(printf '%s' "$links" | { grep -c . || true; })
          if [ "$n" -eq 0 ]; then
            echo "::error::/${handle} links to no find page. The eighty-seven find pages are an island again, reachable only from sitemap.xml, and no visitor can obtain a find's URL from the page that shows it."
            exit 1
          fi
          # The card itself must still open the source. If a permalink ever becomes the card's own
          # href, every click on the only conversion surface lands on Tuned instead of the thing
          # the member was paying attention to — a worse outcome than having no permalink at all.
          if grep -q '<a class="card-link" href="/' /tmp/feed-inbound.html; then
            echo "::error::a feed card on /${handle} now links to Tuned rather than to its source. Roll back."
            exit 1
          fi
          first=$(printf '%s\n' "$links" | sed -n '1p')
          code=$(scripts/prod-http.sh get "${BASE}${first}" /tmp/inbound-find.html 'text/html')
          [ "$code" = "200" ] || { echo "::error::permalink ${first} on /${handle} returns HTTP $code"; exit 1; }
          grep -q 'class="provenance"' /tmp/inbound-find.html \
            || { echo "::error::${first} is not a find page"; exit 1; }
          echo "/${handle}: ${n} permalinks into find pages; ${first} serves one; cards still open their source"
          echo "Inbound edge: \`/${handle}\` carries ${n} permalinks; \`${first}\` resolves" >> "$GITHUB_STEP_SUMMARY"

      # Last, and deliberately able to fail a job in which every check above passed.
      #
      # When the zone is challenging clients, everything above has been read from the Worker's
      # own origin: it proves the code is deployed and behaving, and it proves nothing at all
      # about whether a visitor can reach the site. Those are different claims and this job
      # settles the second one. A green run must continue to mean "the public can use Tuned".
      - name: Public availability
        if: always() && steps.vantage.outputs.zone_blocked == 'true'
        env:
          ZONE_STATUS: ${{ steps.vantage.outputs.zone_status }}
          ZONE_RAY: ${{ steps.vantage.outputs.zone_ray }}
          VANTAGE: ${{ steps.vantage.outputs.vantage }}
        run: |
          set -uo pipefail
          echo "::error::justtuned.com is not serving (HTTP ${ZONE_STATUS}, cf-ray ${ZONE_RAY}). Checks above ran from the Worker origin (vantage=${VANTAGE}) and describe the code, not public availability."
          {
            echo "### Public availability: DOWN"
            echo ""
            echo "- \`justtuned.com/api/version\` → HTTP \`${ZONE_STATUS}\`, cf-ray \`${ZONE_RAY}\`"
            echo "- Checks above read from vantage \`${VANTAGE}\` — Worker health, not site reachability."
            echo "- Owner action: Cloudflare → justtuned.com → Security → Events, filter that Ray ID."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
